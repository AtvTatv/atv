name: Auto Check M3U Links

on:
  schedule:
    # Chạy tự động lúc 0h00 mỗi ngày (giờ UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check M3U Links
        run: |
          python -c "
          import requests

          def check_link(url):
              try:
                  # Gửi request kiểm tra link
                  r = requests.head(url, timeout=5, allow_redirects=True)
                  return r.status_code == 200
              except:
                  return False

          print('Đang kiểm tra và lọc link...')
          # Đọc file M3U hiện tại
          with open('tv.m3u', 'r', encoding='utf-8') as f:
              lines = f.readlines()

          new_lines = []
          i = 0
          while i < len(lines):
              line = lines[i].strip()
              if line.startswith('#EXTINF'):
                  extinf = lines[i]
                  # Lấy dòng URL tiếp theo
                  if i + 1 < len(lines) and not lines[i+1].startswith('#'):
                      url = lines[i+1].strip()
                      # Nếu link sống thì giữ lại
                      if check_link(url):
                          new_lines.append(extinf)
                          new_lines.append(url + '\n')
                      i += 2
                      continue
              elif line.startswith('#EXTM3U'):
                  new_lines.append(line + '\n')
              i += 1

          # Ghi đè file tv.m3u với danh sách link sống
          with open('tv.m3u', 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          "

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tv.m3u
          git commit -m "Auto update: Lọc bỏ các link IPTV đã chết" || exit 0
          git push
