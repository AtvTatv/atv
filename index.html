<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem TV Online - Siêu Dò Link Dự Phòng</title>
  
  <!-- Thư viện phát video HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }

    h1 {
      text-align: center;
      color: #58a6ff;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .main-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
      }
    }

    .player-section {
      background: #161b22;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
    }

    video {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 6px;
    }

    #status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #e3b341;
      padding: 10px;
      background: #0d1117;
      border-radius: 4px;
      word-break: break-all;
    }

    .playlist-section {
      background: #161b22;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #30363d;
      max-height: 500px;
      overflow-y: auto;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      margin-bottom: 6px;
      background: #21262d;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .channel-item:hover { background: #30363d; }
    .channel-item.active { background: #1f6feb; }

    .channel-logo {
      width: 35px;
      height: 35px;
      object-fit: contain;
      background: #000;
      border-radius: 4px;
    }

    .channel-title {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>📺 DANH SÁCH KÊNH TV ONLINE VÀ DÒ DỰ PHÒNG</h1>

  <div class="main-layout">
    <div class="player-section">
      <video id="videoPlayer" controls autoplay muted></video>
      <div id="status">⏳ Đang tải file tv.m3u...</div>
    </div>

    <div class="playlist-section" id="channelList"></div>
  </div>

  <script>
    let channels = [];
    let currentChannel = null;
    let currentSourceIndex = 0;
    let hls = new Hls();
    let timeoutTimer = null;
    
    const video = document.getElementById('videoPlayer');
    const statusText = document.getElementById('status');

    // 1. Tải M3U
    async function loadM3U() {
      try {
        const response = await fetch('tv.m3u?t=' + Date.now());
        if (!response.ok) throw new Error("Không mở được file tv.m3u!");
        const data = await response.text();
        parseM3U(data);
      } catch (err) {
        statusText.style.color = "#f85149";
        statusText.innerText = "❌ Lỗi: " + err.message;
      }
    }

    // 2. Đọc file M3U và lấy tất cả các link (kể cả giấu sau dấu #)
    function parseM3U(content) {
      const lines = content.split('\n');
      channels = [];
      let tempChannel = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          if (tempChannel && tempChannel.sources.length > 0) {
            channels.push(tempChannel);
          }
          const nameMatch = line.match(/,(.+)$/);
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);

          tempChannel = {
            name: nameMatch ? nameMatch[1].trim() : 'Kênh TV',
            logo: logoMatch ? logoMatch[1] : '',
            sources: []
          };
        } else if (tempChannel) {
          // Bắt link chuẩn hoặc link bị comment dạng #http
          if (line.startsWith('http://') || line.startsWith('https://')) {
            tempChannel.sources.push(line);
          } else if (line.startsWith('#http://') || line.startsWith('#https://')) {
            tempChannel.sources.push(line.substring(1));
          }
        }
      }
      if (tempChannel && tempChannel.sources.length > 0) {
        channels.push(tempChannel);
      }

      renderPlaylist();
      if (channels.length > 0) playChannel(0, 0);
    }

    // 3. Tạo danh sách kênh
    function renderPlaylist() {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '';

      channels.forEach((channel, index) => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.id = `channel-${index}`;
        item.onclick = () => playChannel(index, 0);

        const logoImg = channel.logo 
          ? `<img class="channel-logo" src="${channel.logo}" onerror="this.style.display='none'">`
          : `<div class="channel-logo"></div>`;

        item.innerHTML = `${logoImg}<div class="channel-title">${channel.name}</div>`;
        listContainer.appendChild(item);
      });
    }

    // 4. Phát kênh & Tự động nhảy Server nếu quá 4s không load được
    function playChannel(channelIndex, sourceIndex) {
      clearTimeout(timeoutTimer);
      currentChannel = channels[channelIndex];
      currentSourceIndex = sourceIndex;

      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`channel-${channelIndex}`);
      if (activeEl) activeEl.classList.add('active');

      // Nếu đã thử hết các nguồn
      if (sourceIndex >= currentChannel.sources.length) {
        statusText.style.color = "#f85149";
        statusText.innerText = `❌ Kênh "${currentChannel.name}" bị lỗi tất cả ${currentChannel.sources.length} Server!`;
        return;
      }

      const rawUrl = currentChannel.sources[sourceIndex];
      
      statusText.style.color = "#e3b341";
      statusText.innerText = `🔄 [${currentChannel.name}] Đang thử Server ${sourceIndex + 1}/${currentChannel.sources.length}...`;

      // Cấu hình Bộ đếm thời gian: Nếu quá 4 giây không chạy -> Nhảy server tiếp theo ngay!
      timeoutTimer = setTimeout(() => {
        console.warn(`Server ${sourceIndex + 1} quá thời gian chờ, tự động nhảy nguồn tiếp theo...`);
        playChannel(channelIndex, sourceIndex + 1);
      }, 4500);

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls({
          manifestLoadingTimeOut: 3000,
          manifestLoadingMaxRetry: 0,
          fragLoadingTimeOut: 3000,
          fragLoadingMaxRetry: 0
        });

        hls.loadSource(rawUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          clearTimeout(timeoutTimer);
          statusText.style.color = "#3fb950";
          statusText.innerText = `✅ Đang phát: ${currentChannel.name} (Server ${sourceIndex + 1})`;
          video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            clearTimeout(timeoutTimer);
            playChannel(channelIndex, sourceIndex + 1);
          }
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = rawUrl;
        video.onloadeddata = () => {
          clearTimeout(timeoutTimer);
          statusText.style.color = "#3fb950";
          statusText.innerText = `✅ Đang phát: ${currentChannel.name} (Server ${sourceIndex + 1})`;
          video.play();
        };
        video.onerror = () => {
          clearTimeout(timeoutTimer);
          playChannel(channelIndex, sourceIndex + 1);
        };
      }
    }

    loadM3U();
  </script>
</body>
</html>
