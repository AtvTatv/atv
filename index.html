<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem TV Tự Động Dò Kênh</title>
  
  <!-- Nhúng thư viện HLS.js để phát video m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h2 { color: #58a6ff; }

    /* Khung chứa video */
    .video-container {
      max-width: 800px;
      margin: 20px auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Dòng trạng thái thông báo */
    #status {
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
      color: #e3b341;
    }
  </style>
</head>
<body>

  <h2>📺 Trình Phát TV Tự Động Dò Nguồn Sống</h2>

  <div class="video-container">
    <video id="videoPlayer" controls autoplay muted></video>
  </div>

  <div id="status">⏳ Đang khởi tạo...</div>

  <script>
    // -------------------------------------------------------------
    // CHỖ NÀY: Dán danh sách các link nguồn phát của bạn vào đây
    // Nó sẽ thử từ trên xuống dưới, link 1 lỗi sẽ tự nhảy sang link 2
    // -------------------------------------------------------------
    const channelSources = [
      "https://link-kenh-loi-hoac-die-1.m3u8", // Giả lập link chết
      "https://link-kenh-loi-hoac-die-2.m3u8", // Giả lập link chết 2
      "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" // Link chuẩn đang sống (để test)
    ];

    let currentIndex = 0;
    const video = document.getElementById('videoPlayer');
    const statusText = document.getElementById('status');
    let hls = new Hls();

    function playChannel(index) {
      // Nếu đã thử hết các link trong danh sách mà vẫn lỗi
      if (index >= channelSources.length) {
        statusText.style.color = "#f85149";
        statusText.innerText = "❌ Tất cả các nguồn phát của kênh này hiện đều bị lỗi!";
        return;
      }

      statusText.style.color = "#e3b341";
      statusText.innerText = `🔄 Đang thử kết nối Server ${index + 1}...`;
      const currentUrl = channelSources[index];

      if (Hls.isSupported()) {
        hls.destroy(); // Xóa luồng cũ trước khi thử luồng mới
        
        // Cấu hình thời gian chờ: Nếu 6 giây không tải được thì coi như kênh lỗi
        hls = new Hls({
          manifestLoadingTimeOut: 6000,
          levelLoadingTimeOut: 6000
        });

        hls.loadSource(currentUrl);
        hls.attachMedia(video);

        // Bắt lỗi hệ thống
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            console.log(`Server ${index + 1} lỗi, đang chuyển sang Server ${index + 2}...`);
            tryNextSource();
          }
        });

        // Tải thành công
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          statusText.style.color = "#3fb950";
          statusText.innerText = `✅ Đã kết nối thành công Server ${index + 1}!`;
          video.play().catch(() => {
            // Trường hợp trình duyệt chặn tự phát tiếng
            statusText.innerText += " (Bấm Play trên video để bật tiếng)";
          });
        });

      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Dành riêng cho trình duyệt Safari trên iPhone/Mac
        video.src = currentUrl;
        video.onerror = tryNextSource;
      }
    }

    function tryNextSource() {
      currentIndex++;
      playChannel(currentIndex);
    }

    // Chạy chương trình
    playChannel(currentIndex);
  </script>

</body>
</html>
